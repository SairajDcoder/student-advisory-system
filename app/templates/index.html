<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance & Career Advisory System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background: white; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px; animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 {
            text-align: center; color: #333; margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .section-title {
            font-size: 18px; font-weight: 600; color: #5a3e9e;
            margin: 25px 0 15px; padding-bottom: 8px;
            border-bottom: 2px solid #e0d4f5;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label {
            font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #764ba2; outline: none;
        }
        .btn-submit {
            display: block; width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            margin-top: 30px; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.4);
        }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Student Performance & Career Advisory System</h1>
        <p class="subtitle">Enter student details to get a personalised career recommendation powered by Machine Learning</p>

        <form action="/predict" method="POST">
            <div class="section-title">📚 Academic Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Study Hours per Week</label>
                    <input type="number" name="study_hours_per_week" min="0" max="80" step="0.5" value="25" required>
                </div>
                <div class="form-group">
                    <label>Attendance (%)</label>
                    <input type="number" name="attendance_pct" min="0" max="100" step="0.1" value="75" required>
                </div>
                <div class="form-group">
                    <label>Previous GPA (2.0 – 4.0)</label>
                    <input type="number" name="previous_gpa" min="0" max="4" step="0.01" value="3.2" required>
                </div>
                <div class="form-group">
                    <label>Math Score (0 – 100)</label>
                    <input type="number" name="math_score" min="0" max="100" value="70" required>
                </div>
                <div class="form-group">
                    <label>Science Score (0 – 100)</label>
                    <input type="number" name="science_score" min="0" max="100" value="65" required>
                </div>
                <div class="form-group">
                    <label>English Score (0 – 100)</label>
                    <input type="number" name="english_score" min="0" max="100" value="72" required>
                </div>
            </div>

            <div class="section-title">💡 Skills & Aptitude</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Programming Score (0 – 100)</label>
                    <input type="number" name="programming_score" min="0" max="100" value="60" required>
                </div>
                <div class="form-group">
                    <label>Creativity Score (0 – 100)</label>
                    <input type="number" name="creativity_score" min="0" max="100" value="55" required>
                </div>
                <div class="form-group">
                    <label>Communication Score (0 – 100)</label>
                    <input type="number" name="communication_score" min="0" max="100" value="65" required>
                </div>
                <div class="form-group">
                    <label>Leadership Score (0 – 100)</label>
                    <input type="number" name="leadership_score" min="0" max="100" value="50" required>
                </div>
            </div>

            <div class="section-title">🏆 Experience & Background</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Extracurricular Activities (0 – 5)</label>
                    <input type="number" name="extracurricular_activities" min="0" max="5" value="2" required>
                </div>
                <div class="form-group">
                    <label>Internship Experience</label>
                    <select name="internship_experience" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Projects Completed (0 – 10)</label>
                    <input type="number" name="projects_completed" min="0" max="10" value="3" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Parental Education</label>
                    <select name="parental_education" required>
                        <option value="High School">High School</option>
                        <option value="Bachelor">Bachelor</option>
                        <option value="Master">Master</option>
                        <option value="PhD">PhD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Part-Time Job</label>
                    <select name="part_time_job" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">🔮 Get Career Recommendation</button>
        </form>
    </div>
</body>
</html>
