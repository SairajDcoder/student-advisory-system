<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Recommendation Result</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            max-width: 700px; width: 100%;
            background: white; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px; animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { text-align: center; color: #333; margin-bottom: 25px; }
        .career-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 12px; padding: 30px;
            text-align: center; margin-bottom: 25px;
        }
        .career-card h2 { font-size: 28px; margin-bottom: 5px; }
        .career-card p { font-size: 14px; opacity: 0.9; }
        .confidence-section h3 {
            color: #5a3e9e; margin-bottom: 15px; font-size: 18px;
        }
        .confidence-bar {
            margin-bottom: 12px;
        }
        .confidence-bar .label {
            display: flex; justify-content: space-between;
            font-size: 13px; font-weight: 600; color: #444;
            margin-bottom: 4px;
        }
        .bar-bg {
            background: #e9e3f5; border-radius: 8px; height: 24px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%; border-radius: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 1s ease;
        }
        .btn-back {
            display: block; width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 25px; text-decoration: none; text-align: center;
            transition: transform 0.2s;
        }
        .btn-back:hover { transform: translateY(-2px); }
        .error { color: #e74c3c; text-align: center; padding: 20px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        {% if error %}
            <h1>⚠️ Error</h1>
            <p class="error">{{ error }}</p>
        {% else %}
            <h1>🎯 Career Recommendation</h1>
            <div class="career-card">
                <p>Recommended Career Path</p>
                <h2>{{ career }}</h2>
            </div>

            <div class="confidence-section">
                <h3>📊 Confidence Scores</h3>
                {% for label, score in confidence.items() %}
                <div class="confidence-bar">
                    <div class="label">
                        <span>{{ label }}</span>
                        <span>{{ score }}%</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: {{ score }}%"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% endif %}

        <a href="/" class="btn-back">← Try Another Prediction</a>
    </div>
</body>
</html>
